<!DOCTYPE html>
<html lang="en">
<head>
    <!-- ========================================================================
         BASIC META TAGS
         ======================================================================== -->

    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

    <!-- ========================================================================
         PRIMARY META TAGS
         ========================================================================
         {%title%} is Dash's own placeholder. It resolves to the `title=`
         passed to dash.register_page for the current page, falling back to
         app.title. pages/markdown.py registers one per page already.

         TWO RULES IF YOU EDIT THIS BLOCK.

         1. Keep the title element. dash-improve-my-llms locates it with a
            dot-matches-newline regex anchored on the opening and closing
            tags, and rewrites the first match. Remove the element and
            nothing is rewritten and no page has a title at all.

         2. Never spell a tag name in angle brackets, or a Dash placeholder
            by name, anywhere inside a comment. Dash substitutes placeholders
            by plain string replacement over the whole template, comments
            included — a placeholder named in a comment emits its entire
            block twice, invisibly in a browser and fully visibly to
            scrapers.
         ======================================================================== -->
    <title>{%title%}</title>

    <meta name="title" content="dash-pannellum — 360° panoramas for Dash">
    <meta name="keywords" content="Python Dash, Pannellum, panorama, 360 video, virtual tour, equirectangular, multiresolution, WebGL, Plotly Dash, Dash component">
    <meta name="author" content="Pip Install Python LLC">
    <meta name="robots" content="index, follow">
    <meta name="language" content="English">

    <!-- ========================================================================
         OPEN GRAPH / TWITTER TAGS
         ========================================================================
         ONE RULE, and it is the whole reason this block is short: declare only
         what Dash does NOT emit itself.

         dash.register_page() makes Dash generate description, og:type,
         og:title, og:description, og:image and the full twitter:* set on
         EVERY request, per page (see _page_meta_tags in dash/_pages.py).
         Declaring them here as well produces two of each — and the static
         copy describes the SITE while Dash's describes the PAGE. Which one a
         scraper honours is not defined; in practice the later tag wins.

         og:site_name, og:url and the og:image auxiliaries are genuinely
         absent from Dash's set, so they belong here.
         tests/test_social_card.py asserts the counts in both directions. -->

    <meta property="og:url" content="https://pannellum.2plot.dev/">

    <!-- THE SOCIAL CARD — the image URL itself is NOT declared here.
         Deliberately.

         Dash emits og:image and twitter:image for every page from
         register_page(image_url=...), which lib/constants.OG_IMAGE_URL
         supplies (run.py, pages/home.py, pages/markdown.py). A static copy
         here would make TWO of each tag and let the scraper choose.

         What stays are the auxiliaries Dash never emits. Keep them in step
         with lib/constants.OG_IMAGE_* — a width/height that disagrees with
         the real file is worse than declaring none, because the platform
         reserves that box and crops into it. scripts/smoke_live.py reads the
         IHDR chunk of the actual CDN object after every deploy and compares.

         secure_url is the https duplicate Facebook still reads; type saves
         the scraper a HEAD request to learn the format. -->
    <meta property="og:image:secure_url" content="https://cdn.2plot.ai/github_assets/pannellum.2plot.dev.png">
    <meta property="og:image:type" content="image/png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="dash-pannellum — 360° panoramas for Dash">

    <meta property="og:site_name" content="dash-pannellum — 360° panoramas for Dash">
    <meta property="og:locale" content="en_US">

    <!-- Same rule: Dash emits twitter:url, twitter:title, twitter:description
         and twitter:image per page, so those are not repeated here.
         twitter:card IS repeated, on purpose. Dash writes it as
         `property="twitter:card"`; the crawler document dash-improve-my-llms
         builds writes the spec's `name="twitter:card"`. Both are valid to
         Twitter, but they are DIFFERENT tags to every parser that reads by
         attribute — so the two heads disagreed on the one field that decides
         whether a share renders as a large image or a bare link, and only the
         crawler half was right (measured on production 2026-08-26: crawler
         ['summary_large_image'], browser []). The static name= tag below is
         what makes the browser head say the same thing. Keep its value in
         step with the card's shape (1200x630 -> summary_large_image);
         scripts/smoke_live.py's identity-parity block fails the deploy if
         these two heads ever part again. Alt text stays because Dash omits
         it entirely. -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:image:alt" content="dash-pannellum — 360° panoramas for Dash">

    <!-- ========================================================================
         FAVICON + INSTALLABLE-APP SURFACE
         Every file below ships in assets/favicon/ — a 404'd icon link is
         worse than none, and tests/test_social_card.py resolves each one.
         The manifest is what turns this into an installable app; keep its
         theme_color in step with the meta below.
         ======================================================================== -->

    <link rel="icon" type="image/x-icon" href="/assets/favicon.ico">
    <link rel="icon" type="image/png" sizes="16x16" href="/assets/favicon/favicon-16x16.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="96x96" href="/assets/favicon/favicon-96x96.png">
    <!-- The two large squares are NOT decoration and NOT optional. 192x192 is
         the size Google's indexer prefers for the favicon it shows beside a
         search result, and 512 is what an install prompt uses. run.py's
         configure_seo(icons=) has declared both since the Tier-B round, so the
         CRAWLER head carried them while this browser head did not — the exact
         crawler/browser identity split the 2.5.0 standard exists to close,
         shipped here for weeks (measured on production 2026-08-26: crawler
         6 sizes, browser 4). Both files ship in assets/favicon/ and the
         manifest already references them. This list and run.py's must stay
         set-equal; tests/test_seo_icons.py pins run.py's against discovery,
         and scripts/smoke_live.py's identity-parity block pins the two heads
         against each other on the wire. -->
    <link rel="icon" type="image/png" sizes="192x192" href="/assets/favicon/android-chrome-192x192.png">
    <link rel="icon" type="image/png" sizes="512x512" href="/assets/favicon/android-chrome-512x512.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/favicon/apple-touch-icon.png">
    <link rel="manifest" href="/assets/favicon/site.webmanifest">
    <meta name="theme-color" content="#12B886">

    <!-- ========================================================================
         CANONICAL URL — deliberately NOT set here.

         dash-improve-my-llms injects a per-page canonical link built from
         app._base_url (see lib/constants.py). A hard-coded tag in this
         template does not replace that one, it joins it: every page then
         ships two canonical tags, and a conflicting pair is treated as no
         signal at all. Change the origin with APP_BASE_URL, not here.
         ======================================================================== -->

    <!-- ========================================================================
         URL SYNC ON SPA NAVIGATION
         ========================================================================
         Dash routes through history.pushState, which fires no event, so
         og:url / twitter:url / canonical keep advertising the entry URL for
         the rest of the session. Google runs JS and sees the corrected
         values; social scrapers do NOT, which is why the scheme half of this
         problem is fixed server-side in lib/proxy.py instead.

         The origin is read from the og:url tag above rather than hard-coded
         again — one value to change. It is deliberately not location.origin:
         a hosting platform's generated hostname keeps resolving after a
         custom domain is attached, and hits on it must consolidate onto the
         custom domain rather than compete with it. -->
    <script>
        (function () {
            var declared = document.querySelector('meta[property="og:url"]');
            var ORIGIN;
            try {
                ORIGIN = new URL(declared.content).origin;
            } catch (e) {
                return;  // no og:url to learn from: leave every tag alone
            }

            function sync() {
                var path = location.pathname.replace(/\/+$/, '') || '/';
                var href = ORIGIN + (path === '/' ? '/' : path);

                // querySelectorAll, not querySelector: og:url and twitter:url
                // may each appear once from this template and once from the
                // package's prerender block, and both copies must agree.
                document.querySelectorAll(
                    'meta[property="og:url"], meta[property="twitter:url"], ' +
                    'link[rel="canonical"]'
                ).forEach(function (el) {
                    if (el.tagName === 'LINK') { el.href = href; }
                    else { el.setAttribute('content', href); }
                });
            }

            sync();

            ['pushState', 'replaceState'].forEach(function (method) {
                var original = history[method];
                history[method] = function () {
                    var result = original.apply(this, arguments);
                    sync();
                    return result;
                };
            });
            window.addEventListener('popstate', sync);
        })();
    </script>

    <!-- ========================================================================
         STRUCTURED DATA (Schema.org)
         SoftwareSourceCode, not SoftwareApplication: this describes an
         open-source library you import, not a hosted app you sign up for.
         ======================================================================== -->
    <script type="application/ld+json">
    {
        "@context": "https://schema.org",
        "@graph": [
            {
                "@type": "SoftwareSourceCode",
                "name": "dash-pannellum — 360° panoramas for Dash",
                "description": "dash-pannellum — interactive 360° panoramas, virtual tours, multi-resolution tiles and 360° video for Plotly Dash, built on the plug-in-free Pannellum WebGL viewer. By Pip Install Python.",
                "url": "https://pannellum.2plot.dev",
                "codeRepository": "https://github.com/pip-install-python/dash-pannellum",
                "programmingLanguage": ["Python", "JavaScript"],
                "runtimePlatform": "Python 3.9+, Dash 4.2+",
                "license": "https://opensource.org/licenses/MIT",
                "author": {
                    "@type": "Organization",
                    "name": "Pip Install Python LLC",
                    "url": "https://2plot.ai"
                }
            },
            {
                "@type": "WebSite",
                "name": "dash-pannellum — 360° panoramas for Dash",
                "url": "https://pannellum.2plot.dev",
                "publisher": {
                    "@type": "Organization",
                    "name": "Pip Install Python LLC",
                    "url": "https://2plot.ai"
                }
            }
        ]
    }
    </script>

    <!-- ========================================================================
         LLM DISCOVERY META TAGS (dash-improve-my-llms)
         ======================================================================== -->

    <meta name="llms-txt" content="https://pannellum.2plot.dev/llms.txt">
    <meta name="llms-architecture" content="https://pannellum.2plot.dev/sitemap.xml">
    <meta name="llms-github-repo" content="https://github.com/pip-install-python/dash-pannellum">

    <!-- ========================================================================
         PERFORMANCE OPTIMIZATION
         ======================================================================== -->

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://cdn.pannellum.org" crossorigin>

    <!-- ========================================================================
         DASH-SPECIFIC TEMPLATE TAGS - DO NOT MODIFY
         ======================================================================== -->

    {%metas%}
    {%favicon%}
    {%css%}

</head>
<body>
    <!-- ========================================================================
         APPLICATION ENTRY POINT - DO NOT MODIFY
         ======================================================================== -->

    {%app_entry%}

    <footer>
        {%config%}
        {%scripts%}
        {%renderer%}
    </footer>

    <!-- A no-JS fallback block used to sit here: a static site-level heading,
         the site description, and links to the machine surfaces. It was
         removed 2026-08-22. dash-improve-my-llms 2.6.1 serves the universal
         prerender VISIBLE inside #react-entry-point, so a reader that never
         runs JS already gets this page's own prose, and the machine surfaces
         are already declared as link rel tags in the head above. Kept, it put
         the SITE heading underneath the PAGE's on every route. Do not re-add
         static body content here — the prerender is the fallback now. -->
</body>
</html>
