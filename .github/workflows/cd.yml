name: CD

# Deploys pannellum.2plot.dev, then checks the live site.
#
# THE ROAD (sync item 13, owner decision A of 2026-08-29): Render auto-deploys
# the `release` branch, and ONLY this workflow writes `release` — a
# fast-forward push of the run's own sha, after the CI matrix is green. A push
# to `main` is therefore not a deploy; it is a candidate. Measured reason (on
# the template, 2026-08-29): a commit pushed to main was built by Render
# inside the minute, its CD run went red a minute later with the deploy job
# skipped, and /healthz served the red build for ~6 minutes. CI could not stop
# a deploy because Render watched the same branch CI was still judging. Now it
# watches a branch that only ever holds certified commits.
#
# The Render deploy-hook step is GONE from this file; the repository secret it
# read (the `…_DEPLOY_HOOK_URL` one) is inert and safe to delete — its name is
# deliberately not spelled here, because sync item 13's detect greps this file
# for it. `main` ahead of `release` means an uncertified push is pending (its
# run red or running) — never "drift", never a reason to deploy by hand.
#
# OWNER STEP, not this workflow's: this service is Blueprint-managed only if
# the owner created it that way. Where it is not, render.yaml's `branch:` is
# documentation and the dashboard's Branch field is the actual switch.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      target_url:
        description: Site to verify (skips the deploy when set to another host)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: cd-production
  cancel-in-progress: false

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  SITE_URL: ${{ inputs.target_url || 'https://pannellum.2plot.dev' }}
  # The fleet probe convention (1.6.44 item 4). Every curl in this workflow
  # that fetches a host sends it, so the far side's tracker drops the row at
  # write time and a run does not inflate a ledger. The engine token leads
  # (dash-improve-my-llms classifies on it); `2plot-internal/probe` is the
  # suppression half. Mirrors lib/constants.PROBE_UA_SUFFIX — one spelling.
  PROBE_UA: "curl/8 2plot-internal/probe"

jobs:
  test:
    name: ci
    uses: ./.github/workflows/ci.yml

  deploy:
    name: deploy to render
    needs: [test]
    runs-on: ubuntu-latest
    # Long enough for the build-match wait below (up to 100 × 15s) and no
    # longer. Without it the job inherits GitHub's six-hour default, which
    # is how a platform that never comes back healthy holds the
    # `cd-production` concurrency group all day. Sized for the WORST build,
    # not the median: a floor bump busts the Docker dependency cache by
    # design, so this pipeline's most important deploy is also Render's
    # slowest — dash-email's wait timed out on exactly that build class
    # (2026-08-23) with the old 60 × 15s window.
    timeout-minutes: 30
    environment:
      name: production
      url: https://pannellum.2plot.dev
    # `contents: write` on THIS job only — it is the one thing in the
    # workflow that writes to the repository (the `release` ref). The
    # workflow-level grant above stays `read`.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          # FULL history, not the default depth-1 shallow clone. A shallow
          # HEAD pushed onto an EXISTING `release` is rejected as
          # non-fast-forward ("fetch first") because the clone cannot show
          # the remote that release's tip is an ancestor. The template's
          # FIRST promote succeeded only because `release` did not exist
          # yet; its second failed in one second (run 33262495272,
          # 2026-08-29). tests/test_cd_promotes_release.py pins this.
          fetch-depth: 0

      - name: Promote to release
        # Only a push to main promotes. A workflow_dispatch that names
        # another host (target_url) is a verify-only run against that host
        # and must not move this repo's release ref. (The hook step this
        # replaced had no such guard.)
        if: github.event_name == 'push' || inputs.target_url == ''
        run: |
          # Fast-forward push of the run's own sha. `needs: [test]` is the
          # gate: a red matrix never reaches this step, so `release` cannot
          # receive an uncertified commit by construction. On the FIRST run
          # `release` does not exist yet and this push creates it.
          #
          # NOT --force, on purpose: a non-fast-forward means somebody wrote
          # `release` by hand (a rollback, a hotfix). This job then FAILS
          # and says so; a force here would silently undo that person.
          #
          # GITHUB_TOKEN pushes trigger no workflows — correct: `on:` is
          # main-only, and it is Render, not Actions, that reacts to
          # `release` (render.yaml `branch: release`, autoDeploy on).
          git push origin "HEAD:refs/heads/release"
          echo "::notice::release → ${GITHUB_SHA} (fast-forward)"

      - name: Wait for THIS build to serve traffic
        # Render's autoDeploy on `release` ships the commit minutes after the
        # promote above, so this wait is what makes the verify job's target
        # THIS run's artifact. Without it the battery ran three seconds later
        # against the PREVIOUS release — a defect invisible for the
        # workflow's whole life (the old build always already passed the old
        # battery) until a new surface made the race lose (muicharts,
        # 2026-08-21, fleet-wide class).
        run: |
          # A bare 200 proves nothing about WHICH build answered: /healthz
          # now reports the running instance's commit (RENDER_GIT_COMMIT),
          # and this loop holds until it equals the SHA that triggered this
          # run. Fallback: a build that predates the field gets the old
          # sustained-health wait, with a warning naming what it can't tell
          # — that fallback fires exactly once, on the deploy carrying the
          # field for the first time.
          want="${GITHUB_SHA}"
          matched=0
          ok=0
          for _ in $(seq 1 100); do
            body="$(curl -fsS -A "$PROBE_UA" "$SITE_URL/healthz" 2>/dev/null || true)"
            if [ -n "$body" ]; then
              build="$(printf '%s' "$body" | python3 -c 'import sys,json;print(json.load(sys.stdin).get("build",""))' 2>/dev/null || true)"
              if [ "$build" = "$want" ]; then
                matched=$((matched + 1))
                [ "$matched" -ge 3 ] && break
              elif [ -z "$build" ]; then
                ok=$((ok + 1))
              fi
            fi
            sleep 15
          done
          if [ "$matched" -ge 3 ]; then
            echo "::notice::live /healthz reports build $want — verifying the artifact this run shipped."
          elif [ "$ok" -ge 5 ]; then
            echo "::warning::live /healthz predates the build field — cannot prove WHICH build is serving; verified sustained health only. This warning should appear exactly once."
          else
            echo "::error::$SITE_URL never served this run's build ($want) and never became reliably healthy"
            exit 1
          fi

  verify:
    name: verify the live site
    needs: [deploy]
    # ONLY after a successful deploy (sync item 13, ops finding on the
    # template's run 33262495272): the old `!= 'cancelled' && != 'skipped'`
    # admitted 'failure', so when the promote step failed this job ran anyway
    # and reported GREEN — it had smoke-tested the PREVIOUS build. A verify
    # that passes when nothing deployed must not exist. (muicharts' 2026-08-24
    # `!= 'skipped'` half is subsumed: skipped is not success either.)
    if: needs.deploy.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          # The fleet Python (template 1.6.27 item 5) — same literal as the
          # Dockerfile's FROM minor and ci.yml's matrix main, pinned by
          # tests/test_python_version.py. This runner does not serve the app;
          # it runs the batteries, and its python_matches_declared check
          # compares the LIVE host against the image, not against this.
          python-version: "3.14"

      - name: The live build IS this run's sha
        # Belt to the `if:` above's braces, and stronger: it also catches a
        # promote that succeeded while Render's build did not, or a later
        # run that promoted past us between deploy and verify. Skipped on a
        # workflow_dispatch against another host (its shas are not ours).
        if: github.event_name == 'push' || inputs.target_url == ''
        run: |
          build="$(curl -fsS -A "$PROBE_UA" "$SITE_URL/healthz" | python3 -c 'import sys,json;print(json.load(sys.stdin).get("build",""))')"
          if [ "$build" != "$GITHUB_SHA" ]; then
            echo "::error::verify refuses: $SITE_URL serves build '${build:-<none>}', this run is $GITHUB_SHA — nothing this run shipped is on the wire to verify"
            exit 1
          fi
          echo "::notice::verifying build $build (this run's sha)"

      # The battery needs the APP IMPORTABLE, not just checked out (1.6.44
      # item 19's rider). `ai_bot_posture` compares the SERVED robots.txt
      # against the one this app GENERATES, and it generates it by importing
      # run.py through lib/robots_expected. Without the dependencies that
      # import raises, the row records `skip`, and a skip in a green run is
      # a row that compared nothing while reading as fine — which is the
      # exact failure mode item 19 exists to prevent, reproduced inside the
      # check meant to catch it.
      #
      # Same two-command install as the Dockerfile and ci.yml: markdown2dash
      # 0.1.2 declares gunicorn<22 against the CVE-driven >=23 floor, so it
      # goes in --no-deps.
      - name: Install the app so the battery can generate its own robots.txt
        run: |
          pip install -r requirements.txt
          pip install --no-deps markdown2dash==0.1.2
          pip install .

      # The network battery first: it is the same script, with the same check
      # names, that CI ran against the container this deploy shipped. A name
      # that passed in CI and fails here isolates the fault to the deploy.
      - name: Network smoke battery
        run: python scripts/network_smoke.py --base-url "$SITE_URL"

      # Then the satellite-specific checks the battery does not make: every
      # canonical, every crawler body, and every peer llms.txt in the
      # directory actually resolving.
      - name: Smoke-test the deployment
        run: python scripts/smoke_live.py "$SITE_URL"

      - name: Report
        if: failure()
        run: |
          echo "::error::Live verification failed for $SITE_URL. Every failure these check for is silent in production: a site identity that fell back to a framework default, a stale dash-improve-my-llms artifact, a canonical on the wrong host, a page serving the JavaScript stub, a missing network directory, and dead peer llms.txt links."
