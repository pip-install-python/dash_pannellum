name: Release

# Tag-driven publish, on the fleet pattern proven by dash-emoji-mart. Push a
# v* tag and this verifies, builds, publishes to PyPI via OIDC trusted
# publishing, and opens a GitHub Release.
#
# NO API TOKEN IS STORED ANYWHERE. Trusted publishing has PyPI verify a
# short-lived OIDC token minted by GitHub for this specific repo + workflow +
# environment. The PyPI-side publisher (already configured under the
# project's Trusted Publisher Management) must match EXACTLY:
#   Owner:            pip-install-python
#   Repository:       dash_pannellum    <- underscore; OIDC claims do not
#                                          follow GitHub rename redirects
#   Workflow name:    release.yml
#   Environment name: pypi

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and verify, but publish to TestPyPI instead of PyPI"
        type: boolean
        default: true

permissions:
  contents: read

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  verify:
    name: Verify the tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Tag must match pyproject.toml, package.json AND the generated package
        # The third check is the one this repo has actually been burned by:
        # 0.4.1 bumped pyproject and package.json but nobody re-ran
        # `npm run build`, so the committed dash_pannellum/package-info.json
        # (which is what __version__ reports at runtime) still said 0.4.0.
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PY_VER=$(python -c "import re;print(re.search(r'^version = \"([^\"]+)\"', open('pyproject.toml').read(), re.M).group(1))")
          JS_VER=$(python -c "import json;print(json.load(open('package.json'))['version'])")
          PKG_VER=$(python -c "import json;print(json.load(open('dash_pannellum/package-info.json'))['version'])")
          echo "tag=$TAG  pyproject=$PY_VER  package.json=$JS_VER  package-info.json=$PKG_VER"
          [ "$TAG" = "$PY_VER" ]  || { echo "::error::Tag v$TAG does not match pyproject version $PY_VER"; exit 1; }
          [ "$TAG" = "$JS_VER" ]  || { echo "::error::Tag v$TAG does not match package.json version $JS_VER"; exit 1; }
          [ "$TAG" = "$PKG_VER" ] || { echo "::error::Generated package says $PKG_VER — run 'npm run build' and commit"; exit 1; }

  test:
    # The full CI battery (secretless pytest matrix + docker boot + battery)
    # against the tagged commit — tags don't trigger ci.yml or cd.yml on
    # their own, and nothing should reach PyPI that the matrix hasn't passed.
    name: ci
    uses: ./.github/workflows/ci.yml

  build:
    name: Build distributions
    needs: [verify, test]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # No node here on purpose: the webpack bundle and generated classes in
      # dash_pannellum/ are committed, and verify has already pinned their
      # version to the tag. Building from the checkout is what guarantees
      # PyPI ships exactly what the repo holds.
      - name: Build sdist + wheel
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check dist/*

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The environment name must match the trusted publisher configured on
    # PyPI. Add a required reviewer on this environment in repo settings if
    # you want a human approval gate between the tag and the upload.
    environment:
      name: pypi
      url: https://pypi.org/p/dash-pannellum
    permissions:
      # `id-token: write` is what lets GitHub mint the OIDC token PyPI
      # checks. Without it trusted publishing fails with an opaque 403.
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Publish to TestPyPI (manual dry run)
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

      - name: Publish to PyPI
        if: startsWith(github.ref, 'refs/tags/v')
        uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    name: GitHub Release
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Extract this version's CHANGELOG section
        # Headings here are `## X.Y.Z — date` (no brackets), so match on the
        # bare version after `## `.
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v v="$VERSION" '
            $0 ~ "^## " v {found=1; next}
            found && /^## / {exit}
            found {print}
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "See CHANGELOG.md for details." > release-notes.md
          fi
          cat release-notes.md

      - uses: softprops/action-gh-release@v3
        with:
          body_path: release-notes.md
          files: dist/*
          generate_release_notes: true
