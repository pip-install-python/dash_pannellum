# CI for pannellum.2plot.dev — the 2plot network baseline, ported from
# dash-documentation-boilerplate (see its docs/network-standard):
#
#   * least-privilege `permissions` and a cancel-in-progress `concurrency`
#     group, so a workflow cannot write more than it reads and a rapid second
#     push does not race the first;
#   * an explicit `timeout-minutes` on every job — the default is six hours,
#     which is how a hung `curl` burns a day of runner minutes unnoticed;
#   * the real Docker image, built with a buildx GHA cache, then BOOTED, then
#     probed by the same battery that runs against production;
#   * version fingerprints asserted INSIDE the image, because pip metadata is
#     invisible from the outside and a stale artifact serves quietly;
#   * a secretless in-process pytest suite — no CLERK_*, no
#     CROSS_APP_WEBHOOK_SECRET — because the fail-closed behaviour is only
#     provable when nothing is configured;
#   * a GATING pip-audit (advisory until 2026-08-21, when the clerk 7 /
#     cryptography 50 floors made the baseline quiet).

name: CI

# Deliberately NOT `push: branches: [main]`. cd.yml runs on that push and its
# first job `uses:` this workflow, so a push to main would start two runs of
# it — which then contend for the `ci-${{ github.ref }}` concurrency group
# below and cancel each other. Pull requests get their own CI, and `main` is
# owned by CD. There is no coverage gap — CD cannot deploy without this
# workflow passing first.
on:
  pull_request:
  workflow_dispatch:
  # Called by cd.yml so a deploy can never ship something the matrix rejected.
  workflow_call:

# Read-only. Nothing in this workflow publishes, comments or tags; the deploy
# lives in cd.yml behind a `production` environment.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  FORCE_COLOR: "1"
  # Never let a CI run inherit production behaviour: the base-URL guard keys
  # off RENDER / APP_ENV, and the satellite reporter keys off the webhook
  # secret. Both must stay inert here.
  APP_ENV: ci

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install flake8
      - name: flake8
        run: flake8 lib components pages tests scripts run.py

      # The workflows lint themselves. This is not belt-and-braces: an invalid
      # workflow file is the one defect CI structurally cannot report, because
      # the run dies before a job exists to fail. A double-quoted string in a
      # ${{ }} expression silently killed every CI and CD run on the
      # boilerplate for four days — nothing to click, nothing in the API but
      # `conclusion: failure` with zero jobs. actionlint catches it in a
      # second, with the offending column underlined.
      - name: actionlint
        run: |
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.7/scripts/download-actionlint.bash) 1.7.7
          ./actionlint -color

  test:
    # SINGLE quotes inside ${{ }}. GitHub Actions expressions accept no other
    # string delimiter, and a double quote is a LEX error — which invalidates
    # the whole workflow file, not just this line.
    name: py${{ matrix.python }} · ${{ matrix.backend }} · dash${{ matrix.dash && format(' {0}', matrix.dash) || ' (pinned)' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Both backends this site supports get a run on the current Python
        # and the pinned Dash...
        python: ["3.12"]
        backend: [flask, fastapi]
        dash: [""]
        include:
          # ...the supported Python range gets a run on the default backend...
          - python: "3.11"
            backend: flask
            dash: ""
          - python: "3.13"
            backend: flask
            dash: ""
          # ...and the bottom of the >=4.4 range is pinned explicitly on both
          # backends, so a 4.4.0-only regression cannot hide behind pip
          # resolving to something newer. 4.3.0 is deliberately absent: its
          # FastAPI backend 500s on every non-root URL (upstream, fixed in
          # 4.4.0), which is why requirements.txt floors at 4.4.
          - python: "3.12"
            backend: fastapi
            dash: "4.4.0"
          - python: "3.12"
            backend: flask
            dash: "4.4.0"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install the app
        run: |
          pip install -r requirements.txt
          # markdown2dash 0.1.2 declares gunicorn<22 against the CVE-driven
          # gunicorn>=23 floor. Same two-command install as the Dockerfile.
          pip install --no-deps markdown2dash==0.1.2
          # The component under documentation — the docs pages import it.
          pip install .
          # httpx backs starlette's TestClient on the ASGI backend.
          if [ "${{ matrix.backend }}" != "flask" ]; then
            pip install httpx
          fi
          pip install pytest pytest-cov
          # An explicit matrix pin overrides requirements.txt, to prove the
          # bottom of the supported range still works.
          if [ -n "${{ matrix.dash }}" ]; then
            pip install "dash[${{ matrix.backend }}]==${{ matrix.dash }}" \
              || pip install "dash==${{ matrix.dash }}"
          fi

      - name: Confirm the pinned dependency versions
        run: |
          python - <<'PY'
          import dash, dash_improve_my_llms as pkg, gunicorn
          import dash_mantine_components as dmc

          def parts(v):
              return tuple(int(x) for x in v.split(".")[:3] if x.isdigit())

          # 4.4 floor: 4.3.0's FastAPI backend 500s on every non-root URL.
          assert parts(dash.__version__)[:2] >= (4, 4), dash.__version__
          # 2.6.0 is the honesty standard: below it `lastmod=` is swallowed
          # into **kwargs and every date docs/ stamps is dropped from the
          # sitemap. (2.3.4 was the older floor — below THAT,
          # `resolve_site_title` does not exist and this site's published
          # identity degrades to app.title.) run.py enforces the same floor
          # fatally at boot; this asserts the artifact actually carries it.
          assert parts(pkg.__version__) >= (2, 7, 1), pkg.__version__
          # 2.8.0: on 2.7.0 the network-standard mobile drawer renders as a
          # floating card from identical props.
          assert parts(dmc.__version__)[:2] >= (2, 8), dmc.__version__
          # 21.x carried two request-smuggling CVEs (CVE-2024-6827,
          # CVE-2024-1135). markdown2dash's spurious <22 pin must not win.
          assert parts(gunicorn.__version__)[:2] >= (23, 0), gunicorn.__version__
          print(f"dash {dash.__version__}, dash-improve-my-llms "
                f"{pkg.__version__}, dmc {dmc.__version__}, "
                f"gunicorn {gunicorn.__version__}")
          PY

      # No CLERK_*, no CROSS_APP_WEBHOOK_SECRET, no SESSION_SECRET here ON
      # PURPOSE. tests/conftest.py pins them empty and the fail-closed
      # posture depends on that; a secret injected here would make the suite
      # pass for the wrong reason.
      - name: Test suite (${{ matrix.backend }}, zero secrets)
        env:
          DASH_BACKEND: ${{ matrix.backend }}
        run: pytest tests -q

      - name: Boot under a production server
        if: matrix.backend == 'flask'
        run: |
          gunicorn run:server -b 127.0.0.1:8561 --daemon --access-logfile - --error-logfile -
          for _ in $(seq 1 30); do
            curl -sf http://127.0.0.1:8561/healthz && break
            sleep 1
          done
          # A page that renders under the test client can still fail under a
          # real WSGI worker — different import path, different working
          # directory, no test-client conveniences.
          curl -sf http://127.0.0.1:8561/ > /dev/null
          curl -sf http://127.0.0.1:8561/getting-started > /dev/null
          # The battery, against the same server a satellite deploys.
          python3 scripts/network_smoke.py --base-url http://127.0.0.1:8561

  docker:
    name: docker image · boot · battery
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [test]
    steps:
      - uses: actions/checkout@v4

      # The same build Render runs. This is where a dependency-resolution
      # failure surfaces — at CI time, not deploy time, where the only signal
      # is a dashboard log while the old image keeps serving.
      - uses: docker/setup-buildx-action@v3
      - name: Build the production image
        uses: docker/build-push-action@v6
        with:
          context: .
          tags: dash-pannellum-docs:ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # pip metadata is invisible from outside a running host, so the versions
      # are asserted here, inside the artifact that actually ships.
      - name: Version fingerprints inside the image
        run: |
          docker run --rm dash-pannellum-docs:ci python -c "
          from importlib.metadata import version

          def parts(v):
              return tuple(int(x) for x in v.split('.')[:3] if x.isdigit())

          v = version('dash')
          print('dash', v)
          assert parts(v)[:2] >= (4, 4), f'expected dash >=4.4, image has {v}'

          v = version('dash-improve-my-llms')
          print('dash-improve-my-llms', v)
          assert parts(v) >= (2, 7, 1), f'expected >=2.7.1 (deduped h1 + llms.txt v2 discovery), image has {v}'

          v = version('dash-mantine-components')
          print('dash-mantine-components', v)
          assert parts(v)[:2] >= (2, 8), f'expected dmc >=2.8 (drawer renders as a card on 2.7), image has {v}'

          # Vendored, so nothing upstream can bump it for us. 1.0.4 is the
          # first release whose FastAPI auth endpoints are callable at all,
          # and this image runs DASH_BACKEND=fastapi in production — below
          # it, Clerk cannot complete a sign-in here.
          v = version('dash-clerk-auth')
          print('dash-clerk-auth', v)
          assert parts(v) >= (1, 0, 5), f'expected dash-clerk-auth >=1.0.5, image has {v}'

          # The advisory floors: clerk-backend-api 5.x capped cryptography
          # below the fixes for four advisories.
          v = version('cryptography')
          print('cryptography', v)
          assert parts(v)[:1] >= (50,), f'expected cryptography >=50, image has {v}'

          # markdown2dash installs with --no-deps to dodge its gunicorn<22
          # pin; this assert is what proves the dodge kept working. 21.x
          # carried two request-smuggling CVEs (CVE-2024-6827, CVE-2024-1135).
          v = version('gunicorn')
          print('gunicorn', v)
          assert parts(v)[:2] >= (23, 0), f'expected gunicorn>=23, image has {v}'

          # ...and that skipping its dependency graph did not skip the package.
          import markdown2dash  # noqa: F401
          print('markdown2dash importable')

          # The component under documentation ships in the image too.
          v = version('dash-pannellum')
          print('dash-pannellum', v)
          "

      # Boot with no secrets: Clerk falls open (dev mode), the reporter stays
      # dormant, the hub client reports itself disabled. What this catches is
      # any import-time or preload crash — the class of failure where the
      # platform loops the worker and the deploy never goes live. CI green
      # without this job proved nothing about the image: tests run from the
      # working tree, the container only holds what the Dockerfile COPYs.
      - name: Boot the container and wait for /healthz
        run: |
          # Production parity: render.yaml sets DASH_BACKEND=fastapi. Without
          # the flag this boots the flask default and never exercises the
          # uvicorn worker path — the exact WSGI-through-uvicorn failure class
          # the Dockerfile CMD warns about would sail through green.
          docker run -d --name docs -p 8561:8561 -e DASH_BACKEND=fastapi dash-pannellum-docs:ci
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:8561/healthz > /dev/null; then
              echo "healthy after ~$((i*2))s"
              exit 0
            fi
            if [ "$(docker inspect -f '{{.State.Running}}' docs)" != "true" ]; then
              echo "container exited during boot:"
              docker logs docs
              exit 1
            fi
            sleep 2
          done
          echo "never became healthy; last logs:"
          docker logs --tail 100 docs
          exit 1

      # The SAME script CD runs against https://pannellum.2plot.dev, so a
      # failure in CI and a failure in production read identically.
      - name: Smoke battery against the booted container
        run: python3 scripts/network_smoke.py --base-url http://127.0.0.1:8561

      # The guard on the guard (emojimart's F2 finding, 2026-08-24): the
      # boot step curls /healthz from OUTSIDE, which proves the app binds
      # and answers — but says nothing about the Dockerfile's HEALTHCHECK
      # instruction itself. A broken probe (wrong port, missing binary,
      # bad quoting) ships silently while every external check stays
      # green, and the orchestrator that relies on container health sees
      # an opaque box. Poll Docker's own verdict: with --interval=30s and
      # --start-period=20s the first probe lands within ~50s.
      - name: Assert Docker's own health verdict
        run: |
          for i in $(seq 1 30); do
            status="$(docker inspect -f '{{.State.Health.Status}}' docs 2>/dev/null || echo none)"
            if [ "$status" = "healthy" ]; then
              echo "docker reports healthy after ~$((i*3))s"
              exit 0
            fi
            if [ "$status" = "none" ]; then
              echo "image has NO HEALTHCHECK — the container is opaque to its orchestrator"
              exit 1
            fi
            sleep 3
          done
          echo "HEALTHCHECK never reported healthy (last: $status) — the probe itself is broken:"
          docker inspect -f '{{json .State.Health}}' docs || true
          exit 1

      - name: Container logs (for the record)
        if: always()
        run: docker logs --tail 40 docs 2>/dev/null || true

  pip-audit:
    name: pip-audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # NO LONGER ADVISORY (gate-wave, 2026-08-21). This job ran
    # `continue-on-error: true` for as long as the baseline was noisy — four
    # cryptography advisories this repo could not reach a fix for while
    # dash-clerk-auth pinned `clerk-backend-api<6`. That is resolved: the
    # floors in requirements.txt (clerk-backend-api>=7.0.0,<8 +
    # cryptography>=50.0.0) reach the fix for all four, and no advisory is
    # suppressed here any more. A permanently-red advisory job trains
    # everyone to ignore it; a quiet gating job is the only kind worth
    # having, so new advisories now fail the build and block the deploy.
    # To revert to advisory, restore `continue-on-error: true` on one line.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pip-audit
      # Skip local vendor/ paths — pip-audit can only assess PyPI dists.
      #
      # The GHSA-537c-gmf6-5ccf suppression that used to live here is GONE, on
      # purpose. It was gated on "dash-clerk-auth relaxing its <6 pin in its
      # next release" — 1.0.1 did exactly that (`clerk-backend-api<8`), so
      # requirements.txt now pins clerk-backend-api>=7.0.0 and
      # cryptography>=50.0.0, which reaches the fix instead of suppressing it.
      # No advisory is ignored here any more; keep it that way.
      - run: |
          grep -v '^\./vendor/' requirements.txt > /tmp/req-pypi.txt
          pip-audit -r /tmp/req-pypi.txt --skip-editable
